<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>스토툰 · 레이어 작업실</title><link rel="stylesheet" href="/homepage/workspace.css"></head><body><header><a href="/homepage/">stotoon ●</a><span>레이어 작업실</span><a href="/homepage/#beta">베타 신청 ↗</a></header><main><h1>잡고, 옮기고, 다시 다듬으세요.</h1><p>스토툰 제작 예시의 배경과 투명 인물 레이어를 직접 편집합니다.</p><div class="toolbar"><button id="undo" disabled>실행 취소</button><button id="redo" disabled>다시 실행</button><button id="save">이 브라우저에 저장</button><button id="load">저장 불러오기</button><button id="reset">처음 배치</button></div><p id="status" role="status" aria-live="polite">인물을 직접 끌어서 움직여 보세요. 방향키는 선택된 인물을 조금씩 이동합니다.</p><div class="canvas-controls"><button id="drag-mode" aria-pressed="true">레이어 이동 켜짐</button><button id="select-person">인물 선택</button></div><p class="canvas-hint">이동을 끄면 그림 위에서도 페이지를 스크롤할 수 있습니다.</p><div class="workspace"><div id="panels"></div><aside class="inspector"><h2 id="selected-title">레이어 선택</h2><div id="tool-content"></div></aside></div><p class="footnote">저장은 현재 기기·브라우저에만 보관됩니다. 로그인·서버 작품 보관·AI 생성은 이 공개 작업실에 연결하지 않았습니다. 브라우저 데이터 삭제 시 저장 내용도 삭제됩니다.</p></main><script src="/homepage/workspace.js"></script><script src="/homepage/workspace-objects.js"></script><script src="/homepage/workspace-history.js"></script></body></html>
